version: '3.8'

services:

  postgres:
    image: postgres:16.2
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - keycloak-network


networks:
    keycloak-network:
        driver: bridge

volumes:
    postgres_data:
      driver: local